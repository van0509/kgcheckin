name: 仓库保活

on:
  schedule:
    # 每周一 00:00 UTC（北京时间周一 08:00）运行一次
    # 依据：公开仓库连续 60 天无任何提交/活动，GitHub 会自动禁用其中的定时工作流；
    # 每周一次提交足以让仓库保持活跃，避免签到定时任务被静默停用
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # fork 仓库的定时工作流会被 GitHub 默认禁用，或在仓库久无活动后自动停用；
      # 每次保活时顺带把它们重新打开，避免「手动能跑、定时不跑」
      - name: 重新启用被禁用的定时工作流
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in .github/workflows/*.yml; do
            [ -f "$f" ] || continue
            echo "→ 检查 $f"
            if gh workflow enable "$f" --repo "$GITHUB_REPOSITORY" 2>/dev/null; then
              echo "  ✅ 已启用"
            else
              echo "  ⚠️ 跳过（已是启用状态或无权限）"
            fi
          done

      - name: 更新保活时间戳
        run: |
          mkdir -p .github
          cat > .github/KEEPALIVE.md << EOF
          # Repository Keepalive

          This file is automatically updated to keep the repository active.

          **Last Update:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          **Workflow Run:** #${{ github.run_number }}
          **Trigger:** ${{ github.event_name }}
          **Schedule:** 每周一 00:00 UTC（北京时间周一 08:00）

          ---
          *Auto-generated by [仓库保活 workflow](.github/workflows/仓库保活.yml)*
          EOF

      - name: 提交并推送
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add .github/KEEPALIVE.md

          if git diff --staged --quiet; then
            echo "无变更"
          else
            git commit -m "chore: keepalive at $(date -u +'%Y-%m-%d')"
            # 防止上游有其他提交导致 push 被拒
            git pull --rebase --autostash || true
            git push
            echo "保活提交成功"
          fi
